name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Manifest and package versions match
        run: |
          test "$(node -p "require('./manifest.json').version")" = "$(node -p "require('./package.json').version")"
      - name: Build the store zip
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
